services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockly-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: stockly
      DB_USERNAME: stockly
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - stockly

  web:
    image: nginx:1.27-alpine
    container_name: stockly-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stockly

  mysql:
    image: mysql:8.0
    container_name: stockly-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: stockly
      MYSQL_USER: stockly
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - stockly-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - stockly

  redis:
    image: redis:7-alpine
    container_name: stockly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stockly-redis-data:/data
    networks:
      - stockly

  # Optional: run queue worker
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile
  #   command: php artisan queue:work --tries=3
  #   volumes:
  #     - ./:/var/www/html
  #   depends_on:
  #     - app
  #     - redis
  #   networks:
  #     - stockly

volumes:
  stockly-mysql-data:
  stockly-redis-data:

networks:
  stockly:
    driver: bridge
